name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without running native postinstall
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Check optional faster-whisper server boundary
        run: npm run test:asr-server
      - name: Check syntax
        run: npm run check
      - name: Check whitespace
        run: git diff --check
      - name: Check tracked artifact size
        shell: bash
        run: |
          if find . -type f -size +20M -not -path './.git/*' -not -path './node_modules/*' -print -quit | grep -q .; then
            echo 'Tracked or workspace artifact exceeds 20 MiB'
            exit 1
          fi

  electron-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install desktop test dependencies
        run: npm ci
      - name: Configure Chromium sandbox helper on the temporary runner
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build and verify reproducible Linux bundle
        run: |
          npm run build:linux
          npm run check:linux-bundle
          sudo chown root:root dist/interviewcoder-local-rebuild-linux-x64/chrome-sandbox
          sudo chmod 4755 dist/interviewcoder-local-rebuild-linux-x64/chrome-sandbox
      - name: Exercise real Electron with synthetic WAV and microphone
        env:
          DEBUG: pw:browser
        shell: bash
        run: |
          set +e
          CODING_HELP_SMOKE_APP_ROOT="$GITHUB_WORKSPACE/dist/interviewcoder-local-rebuild-linux-x64/resources/app" \
          CODING_HELP_SMOKE_ELECTRON="$GITHUB_WORKSPACE/dist/interviewcoder-local-rebuild-linux-x64/electron" \
          xvfb-run -a npm run smoke > "$RUNNER_TEMP/electron-smoke.log" 2>&1
          smoke_status=$?
          cat "$RUNNER_TEMP/electron-smoke.log"
          if [ "$smoke_status" -ne 0 ]; then
            python3 - <<'PY'
          import os, pathlib
          message = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'electron-smoke.log').read_text(errors='replace')[-10000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Electron runtime check failed::' + message)
          PY
          fi
          exit "$smoke_status"
